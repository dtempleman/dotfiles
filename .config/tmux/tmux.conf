# tmux config (tmux 3.2+, read from ~/.config/tmux/tmux.conf)
# No plugins: works the same on a laptop and a fresh remote box.
# Prefix is the default Ctrl-b.

# ------------------------------------------------------------- terminal ---

set -g default-terminal "tmux-256color"
# true colour in modern terminals
set -as terminal-features ",xterm-256color:RGB"
# copy to the local clipboard via OSC 52, also from inside SSH sessions
set -g set-clipboard on
# pass focus events to vim / editors
set -g focus-events on
# no delay after Esc (vim)
set -sg escape-time 10

# -------------------------------------------------------------- general ---

set -g mouse on
set -g history-limit 50000
set -g base-index 1
setw -g pane-base-index 1
set -g renumber-windows on
set -g display-time 2000
# window title in the terminal tab: session / window / host
set -g set-titles on
set -g set-titles-string "#S / #W  #H"

# ------------------------------------------------------------- bindings ---

# reload this file
bind r source-file ~/.config/tmux/tmux.conf \; display "tmux.conf reloaded"

# splits and new windows open in the current directory
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
bind c new-window -c "#{pane_current_path}"

# vim-style pane movement and resizing (repeatable)
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# vi keys in copy mode: prefix [ to enter, v to select, y to copy
setw -g mode-keys vi
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel

# ---------------------------------------------------------------- style ---
# catppuccin mocha

set -g status-position bottom
set -g status-interval 5
set -g status-style "bg=#181825,fg=#cdd6f4"
set -g status-left-length 30
set -g status-left "#[bg=#89b4fa,fg=#1e1e2e,bold] #S #[default] "
# hostname on the right, so it's clear which machine you're on
set -g status-right "#[fg=#a6adc8]%H:%M #[bg=#cba6f7,fg=#1e1e2e,bold] #H "

setw -g window-status-format "#[fg=#6c7086] #I #W "
setw -g window-status-current-format "#[bg=#313244,fg=#fab387,bold] #I #W "
setw -g window-status-separator ""

set -g pane-border-style "fg=#313244"
set -g pane-active-border-style "fg=#89b4fa"
set -g message-style "bg=#313244,fg=#cdd6f4"
setw -g mode-style "bg=#45475a,fg=#cdd6f4"
